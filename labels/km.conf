[labels]
app.name = អុកអន្តរជាតិ

notifications.topic.activity = សកម្មភាពហ្គេម
notifications.topic.message = សារ

# Notification titles and bodies. Recipient-side composition; resolved
# against the recipient's language at notify() time.
notifications.title.game = ហ្គេមអុក
notifications.title.move = ការផ្លាស់ទីអុក
notifications.title.message = សារអុក
notifications.title.chess = អុកអន្តរជាតិ
notifications.body.started_game = {name} បានចាប់ផ្តើមហ្គេម
notifications.body.played_move = {name} បានលេង {move}
notifications.body.opponent_resigned = គូប្រកួតបានចុះចាញ់
notifications.body.draw_offered = បានស្នើស្មើ
notifications.body.draw_agreed = បានយល់ព្រមស្មើ
notifications.body.draw_declined = បានបដិសេធការស្មើ

