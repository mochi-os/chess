[labels]
app.name = ໝາກຮຸກ

notifications.topic.activity = ກິດຈະກຳເກມ
notifications.topic.message = ຂໍ້ຄວາມ

# Notification titles and bodies. Recipient-side composition; resolved
# against the recipient's language at notify() time.
notifications.title.game = ເກມໝາກຮຸກ
notifications.title.move = ການເຄື່ອນໝາກຮຸກ
notifications.title.message = ຂໍ້ຄວາມໝາກຮຸກ
notifications.title.chess = ໝາກຮຸກ
notifications.body.started_game = {name} ໄດ້ເລີ່ມເກມ
notifications.body.played_move = {name} ຫຼິ້ນ {move}
notifications.body.opponent_resigned = ຄູ່ແຂ່ງຍອມແພ້
notifications.body.draw_offered = ສະເໜີການເສມີ
notifications.body.draw_agreed = ຕົກລົງເສມີກັນ
notifications.body.draw_declined = ປະຕິເສດການເສມີ

# Error messages used by a.error.label(...). Generated keys mirror
# the previous hardcoded a.error() literals.
errors.invalid_game_id = ID ເກມບໍ່ຖືກຕ້ອງ
errors.game_not_found = ບໍ່ພົບເກມ
errors.not_a_player_in_this_game = ບໍ່ແມ່ນຜູ້ຫຼິ້ນໃນເກມນີ້
errors.invalid_opponent = ຄູ່ແຂ່ງບໍ່ຖືກຕ້ອງ
errors.cannot_play_against_yourself = ບໍ່ສາມາດຫຼິ້ນກັບຕົນເອງ
errors.can_only_play_with_friends = ສາມາດຫຼິ້ນກັບໝູ່ເທົ່ານັ້ນ
errors.invalid_message = ຂໍ້ຄວາມບໍ່ຖືກຕ້ອງ
errors.message_too_long = ຂໍ້ຄວາມຍາວເກີນໄປ
errors.message_cannot_be_empty = ຂໍ້ຄວາມບໍ່ສາມາດຫວ່າງເປົ່າ
errors.game_is_not_active = ເກມບໍ່ໄດ້ດຳເນີນຢູ່
errors.not_your_turn = ບໍ່ແມ່ນເທື່ອຂອງທ່ານ
errors.game_state_changed = ສະຖານະເກມປ່ຽນແປງແລ້ວ
errors.missing_move_data = ຂາດຂໍ້ມູນການເຄື່ອນ
