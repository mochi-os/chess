errors.invalid_move_notation = ໂນເຕຊັນການເຄື່ອນບໍ່ຖືກຕ້ອງ
errors.invalid_board_state = ສະຖານະກະດານບໍ່ຖືກຕ້ອງ
errors.pgn_too_long = PGN ຍາວເກີນໄປ
errors.you_already_offered_a_draw = ທ່ານໄດ້ສະເໜີການເສມີແລ້ວ
errors.no_draw_offer_to_accept = ບໍ່ມີຂໍ້ສະເໜີເສມີໃຫ້ຍອມຮັບ
